<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1 &amp; 2 Samuel Diagnostic Quiz</title>
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --ink: #2b2320;
    --muted: #7a6f66;
    --accent: #8a4b2f;
    --accent-light: #f1e2d6;
    --good: #3f7d4f;
    --good-bg: #e5f3e8;
    --bad: #b3402f;
    --bad-bg: #fbe9e6;
    --border: #e6dccf;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Georgia, serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 22px 12px 60px;
  }
  .app { width: 100%; max-width: 660px; }
  h1 { font-size: 1.35rem; text-align: center; margin: 4px 0; }
  .subtitle { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab {
    flex: 1; padding: 10px 8px; text-align: center;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; cursor: pointer; font-weight: 600;
    color: var(--muted); transition: all .15s;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-bottom: 14px; font-size: 0.82rem;
  }
  .tool-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--ink);
    padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 0.82rem;
    font-weight: 600; font-family: inherit;
  }
  .tool-btn:hover { border-color: var(--accent); }
  .save-toggle { display: flex; align-items: center; gap: 6px; color: var(--muted); margin-left: auto; cursor: pointer; }
  .save-toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

  .navigator {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin-bottom: 14px;
  }
  .nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 7px; }
  .nav-cell {
    aspect-ratio: 1; border: 1px solid var(--border); border-radius: 8px;
    background: #fffdfb; cursor: pointer; font-size: 0.82rem; font-weight: 600;
    color: var(--muted); font-family: inherit; display: flex;
    align-items: center; justify-content: center; padding: 0;
  }
  .nav-cell:hover { border-color: var(--accent); }
  .nav-cell.current { outline: 2px solid var(--accent); outline-offset: 1px; }
  .nav-cell.right { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .nav-cell.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .nav-legend { font-size: 0.75rem; color: var(--muted); margin-top: 10px; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 20px; box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  .progress-row { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-bottom: 10px; }
  .progress-bar { height: 6px; background: var(--accent-light); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
  .progress-fill { height: 100%; background: var(--accent); transition: width .2s; }
  .question { font-size: 1.02rem; font-weight: 600; line-height: 1.45; margin-bottom: 18px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    text-align: left; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 10px; background: #fffdfb; cursor: pointer;
    font-size: .93rem; line-height: 1.35; color: var(--ink);
    font-family: inherit; transition: all .15s;
  }
  .option:hover { border-color: var(--accent); background: var(--accent-light); }
  .option.correct { background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: 600; }
  .option.incorrect { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); font-weight: 600; }
  .option.disabled { cursor: default; }
  .option.disabled:hover { background: #fffdfb; border-color: var(--border); }
  .option.correct:hover { background: var(--good-bg); border-color: var(--good); }
  .option.incorrect:hover { background: var(--bad-bg); border-color: var(--bad); }
  .feedback { margin-top: 14px; font-size: .9rem; min-height: 20px; font-weight: 600; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .ref-tag {
    display: inline-block; margin-top: 8px; font-size: .82rem; font-weight: 600;
    color: var(--accent); background: var(--accent-light);
    padding: 4px 10px; border-radius: 20px;
  }
  .nav-row { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; }
  button.move {
    background: var(--accent); color: #fff; border: none; padding: 10px 20px;
    border-radius: 8px; font-size: .92rem; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  button.move.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  button.move:disabled { opacity: .35; cursor: default; }

  .result { text-align: center; }
  .score-big { font-size: 2.5rem; font-weight: 700; color: var(--accent); margin: 10px 0 2px; }
  .review-item { text-align: left; border-bottom: 1px solid var(--border); padding: 12px 0; font-size: .9rem; }
  .review-item .qtext { font-weight: 600; margin-bottom: 4px; }
  .review-item .yourans { color: var(--bad); }
  .review-item .correctans { color: var(--good); }
  .review-item .refans { color: var(--muted); font-size: .8rem; margin-top: 2px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="app">
  <h1>1 &amp; 2 Samuel Diagnostic Quiz</h1>
  <div class="subtitle">30 questions each &middot; jump to any question &middot; chapter &amp; verse shown after answering</div>

  <div class="tabs">
    <div class="tab active" id="tab0" onclick="switchBook(0)">1 Samuel</div>
    <div class="tab" id="tab1" onclick="switchBook(1)">2 Samuel</div>
  </div>

  <div class="toolbar">
    <button class="tool-btn" onclick="toggleNavigator()" id="navToggle">Show all questions</button>
    <button class="tool-btn" onclick="showResults()">See score</button>
    <button class="tool-btn" onclick="resetBook()">Reset this book</button>
    <label class="save-toggle"><input type="checkbox" id="saveChk" onchange="onSaveToggle()"> Save my progress</label>

  <div class="navigator hidden" id="navigator"></div>
  <div class="card" id="quizCard"></div>
</div>

<script>

const STORE_KEY = 'samuelQuizProgress_v1';
let currentBook = 0;
let currentQ = 0;
let navOpen = false;
let saveOn = false;
// answers[book][qIndex] = chosen option index, or null
let answers = [ Array(30).fill(null), Array(30).fill(null) ];

/* ---------- storage ---------- */
function storageAvailable() {
  try { const t='__t'; localStorage.setItem(t,t); localStorage.removeItem(t); return true; }
  catch(e) { return false; }
}
function saveState() {
  if (!saveOn || !storageAvailable()) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers, currentBook, currentQ, saveOn:true })); }
  catch(e) {}
}
function loadState() {
  if (!storageAvailable()) { document.getElementById('saveChk').disabled = true; return; }
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s && Array.isArray(s.answers)) {
      answers = s.answers;
      currentBook = s.currentBook || 0;
      currentQ = s.currentQ || 0;
      saveOn = true;
      document.getElementById('saveChk').checked = true;
    }
  } catch(e) {}
}
function onSaveToggle() {
  saveOn = document.getElementById('saveChk').checked;
  if (saveOn) saveState();
  else { try { localStorage.removeItem(STORE_KEY); } catch(e) {} }
}

/* ---------- navigation ---------- */
function switchBook(i) {
  currentBook = i;
  currentQ = 0;
  document.getElementById('tab0').classList.toggle('active', i === 0);
  document.getElementById('tab1').classList.toggle('active', i === 1);
  render();
  saveState();
}
function goTo(i) { currentQ = i; render(); saveState(); }
function nextQ() { if (currentQ < 29) { currentQ++; render(); saveState(); } else showResults(); }
function prevQ() { if (currentQ > 0) { currentQ--; render(); saveState(); } }

function toggleNavigator() {
  navOpen = !navOpen;
  document.getElementById('navigator').classList.toggle('hidden', !navOpen);
  document.getElementById('navToggle').textContent = navOpen ? 'Hide question list' : 'Show all questions';
  if (navOpen) renderNavigator();
}
function renderNavigator() {
  const quiz = QUIZZES[currentBook];
  let html = '<div class="nav-grid">';
  quiz.questions.forEach((item, i) => {
    const a = answers[currentBook][i];
    let cls = 'nav-cell';
    if (a !== null) cls += (a === item.answer) ? ' right' : ' wrong';
    if (i === currentQ) cls += ' current';
    html += `<button class="${cls}" onclick="goTo(${i})">${i+1}</button>`;
  });
  html += '</div><div class="nav-legend">Tap any number to jump there. Green = answered correctly, red = missed, plain = not yet answered.</div>';
  document.getElementById('navigator').innerHTML = html;
}

/* ---------- rendering ---------- */
function render() {
  const quiz = QUIZZES[currentBook];
  const item = quiz.questions[currentQ];
  const chosen = answers[currentBook][currentQ];
  const doneCount = answers[currentBook].filter(a => a !== null).length;
  const pct = Math.round((doneCount / quiz.questions.length) * 100);
  const letters = ['a','b','c','d'];

  let html = `
    <div class="progress-row"><span>${quiz.title} &middot; Question ${currentQ + 1} of 30</span><span>${doneCount} answered</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="question">${item.q}</div>
    <div class="options" id="optionsWrap">`;

  item.options.forEach((opt, idx) => {
    let cls = 'option';
    if (chosen !== null) {
      cls += ' disabled';
      if (idx === item.answer) cls += ' correct';
      else if (idx === chosen) cls += ' incorrect';
    }
    html += `<button class="${cls}" onclick="selectAnswer(${idx})">${letters[idx]}. ${opt}</button>`;
  });
  html += `</div><div class="feedback" id="feedback">`;
  if (chosen !== null) {
    const ok = chosen === item.answer;
    html += `<span class="${ok ? 'good' : 'bad'}">${ok ? 'Correct!' : 'Not quite — the correct answer is highlighted above.'}</span>
             <div class="ref-tag">${quiz.book} ${item.ref}</div>`;
  }
  html += `</div>
    <div class="nav-row">
      <button class="move ghost" onclick="prevQ()" ${currentQ === 0 ? 'disabled' : ''}>Back</button>
      <button class="move" onclick="nextQ()">${currentQ === 29 ? 'Finish' : 'Next'}</button>
    </div>`;

  document.getElementById('quizCard').innerHTML = html;
  if (navOpen) renderNavigator();
}

function selectAnswer(idx) {
  if (answers[currentBook][currentQ] !== null) return;
  answers[currentBook][currentQ] = idx;
  render();
  saveState();
}

function showResults() {
  const quiz = QUIZZES[currentBook];
  const given = answers[currentBook];
  const doneCount = given.filter(a => a !== null).length;
  const score = quiz.questions.reduce((n, item, i) => n + (given[i] === item.answer ? 1 : 0), 0);
  const pct = doneCount ? Math.round((score / doneCount) * 100) : 0;
  let msg = "Keep reviewing — you'll get there.";
  if (pct >= 90) msg = "Excellent grasp of the book.";
  else if (pct >= 75) msg = "Solid understanding.";
  else if (pct >= 50) msg = "Decent start — a bit more review will help.";

  const missed = [];
  quiz.questions.forEach((item, i) => {
    if (given[i] !== null && given[i] !== item.answer) {
      missed.push({ n:i+1, q:item.q, your:item.options[given[i]], correct:item.options[item.answer], ref:`${quiz.book} ${item.ref}` });
    }
  });

  let html = `<div class="result">
      <h2>${quiz.title} — Score</h2>
      <div class="score-big">${score}/${doneCount || 0}</div>
      <div style="color:var(--muted);font-size:.88rem;">${pct}% of the ${doneCount} you answered${doneCount < 30 ? ` &middot; ${30 - doneCount} left` : ''}</div>
      <p>${msg}</p>
      <button class="move ghost" onclick="render()">Back to questions</button>
    </div>`;

  if (missed.length) {
    html += `<h3 style="margin-top:22px;font-size:1rem;">Missed (${missed.length})</h3>`;
    missed.forEach(m => {
      html += `<div class="review-item">
          <div class="qtext">${m.n}. ${m.q}</div>
          <div class="yourans">You chose: ${m.your}</div>
          <div class="correctans">Correct: ${m.correct}</div>
          <div class="refans">${m.ref}</div>
        </div>`;
    });
  }
  document.getElementById('quizCard').innerHTML = html;
}

function resetBook() {
  if (!confirm(`Clear all your answers for ${QUIZZES[currentBook].title}?`)) return;
  answers[currentBook] = Array(30).fill(null);
  currentQ = 0;
  render();
  saveState();
}

/* ---------- init ---------- */
loadState();
document.getElementById('tab0').classList.toggle('active', currentBook === 0);
document.getElementById('tab1').classList.toggle('active', currentBook === 1);
render();
</script>
</body>
</html>
